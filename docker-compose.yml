services:
  redis-master:
    image: redis:7.4
    network_mode: host
    command: redis-server --port 6379
    healthcheck:
      test: redis-cli -p 6379 ping
      interval: 1s
      retries: 30

  redis-replica:
    image: redis:7.4
    network_mode: host
    command: redis-server --port 6380 --replicaof 127.0.0.1 6379
    healthcheck:
      test: redis-cli -p 6380 info replication | grep -q master_link_status:up
      interval: 1s
      retries: 30
    depends_on:
      redis-master:
        condition: service_healthy

  redis-6-master:
    image: redis:6.2
    network_mode: host
    command: redis-server --port 6401
    healthcheck:
      test: redis-cli -p 6401 ping
      interval: 1s
      retries: 30

  redis-6-replica:
    image: redis:6.2
    network_mode: host
    command: redis-server --port 6402 --replicaof 127.0.0.1 6401
    healthcheck:
      test: redis-cli -p 6402 info replication | grep -q master_link_status:up
      interval: 1s
      retries: 30
    depends_on:
      redis-6-master:
        condition: service_healthy

  sentinel:
    image: redis:7.4
    network_mode: host
    command: >-
      sh -c 'printf "port 26379\nsentinel monitor mymaster 127.0.0.1 6379 1\n" > /tmp/sentinel.conf
      && redis-sentinel /tmp/sentinel.conf'
    healthcheck:
      test: redis-cli -p 26379 sentinel get-master-addr-by-name mymaster | grep -q 6379
      interval: 1s
      retries: 30
    depends_on:
      redis-master:
        condition: service_healthy
